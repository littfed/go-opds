run:
  concurrency: 4
  timeout: 5m
  tests: true

issues:
  max-issues-per-linter: 0
  max-same-issues: 50
  exclude-dirs:
    - vendor
    - third_party
    - examples

linters:
  enable:
    # correctness
    - govet
    - staticcheck
    - unused
    - errcheck
    - errorlint
    - nilerr
    - forcetypeassert
    - copyloopvar
    - durationcheck
    - reassign
    # style
    - gocritic
    - revive
    - whitespace
    - godot
    - misspell
    - dupword
    - predeclared
    - errname
    - asciicheck
    # complexity
    - gocyclo
    - nestif
    - funlen
    - dupl
    # performance
    - perfsprint
    - unconvert
    - ineffassign
    - goconst
    # security & resources
    - gosec
    - bidichk
    - bodyclose
    - noctx
    - containedctx
    - fatcontext
    - sqlclosecheck
    - rowserrcheck
    # logging
    - sloglint
    # testing
    - testifylint
    - thelper
    - usetesting
    # modernization & meta
    - exptostd
    - intrange
    - usestdlibvars
    - exhaustive
    - nolintlint

  disable:
    - lll
    - prealloc
    - wrapcheck
    - err113
    - mnd
    - iface
    - nakedret
    - gocognit
    - cyclop
    - depguard
    - goheader
    - importas
    - varnamelen
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - unparam
    - makezero
    - testpackage
    - recvcheck
    - mirror
    - protogetter
    - spancheck
    - zerologlint
    - wsl
    - paralleltest

linters-settings:
  dupl:
    threshold: 100
  errcheck:
    check-type-assertions: true
  funlen:
    lines: 120
    statements: 80
  goconst:
    min-len: 3
    min-occurrences: 4
  gocyclo:
    min-complexity: 15
  nolintlint:
    require-explanation: true
    require-specific: true
  revive:
    rules:
      - name: exported
        arguments:
          - checkPrivateReceivers
          - sayRepetitiveInsteadOfStutters
